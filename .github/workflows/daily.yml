name: daily

on:
  schedule:
    # 02:00 UTC；GitHub 的 cron 常有 10~60 分钟排队，实际数据时间以 manifest.version 为准
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
      ENABLE_GOOGLE_PLAY: 'true'
      PLATFORMS: 'apple,mac,podcasts,google,github,indie'
      REGIONS_LIMIT: '0'
      CONCURRENCY: '6'
      APPLE_RPS: '3'
      MINOR_SLICES: '3'
      GOOGLE_CONCURRENCY: '4'
      GOOGLE_DETAILS_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install optional collector
        run: npm install --no-audit --no-fund --omit=dev || true

      - name: Test
        run: node --test tests/

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/collect.mjs

      - name: Build
        run: node tools/build.mjs

      - name: Validate
        run: node tools/validate.mjs

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain -- data state charts README.md)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add data state charts README.md
          git commit -m "data: $(node -p "require('./data/manifest.json').version")"
          git push
